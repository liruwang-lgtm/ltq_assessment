<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1696" viewBox="0 0 2000 1696" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" role="img" aria-labelledby="t d"><title id="t">The Coherence Map</title><desc id="d">Three stages of transition (Taking-Off, Cruising, Awakening) set against three layers of coherence (Me, We, The World), giving nine positions.</desc><rect width="2000" height="1696" fill="#ffffff"/><text x="1000" y="118" font-size="80" font-weight="bold" font-style="normal" fill="#1f3864" text-anchor="middle">The Coherence Map</text><text x="1000" y="188" font-size="44" font-weight="normal" font-style="normal" fill="#5a6475" text-anchor="middle">Three Stages of Transition × Three Layers of Coherence</text><line x1="60" y1="236" x2="1940" y2="236" stroke="#d6dce5" stroke-width="3"/><rect x="60" y="272" width="360" height="208" rx="16" fill="#f4f6fa"/><text x="240" y="361" font-size="42" font-weight="bold" font-style="normal" fill="#5a6475" text-anchor="middle">Stage ↓</text><text x="240" y="420" font-size="42" font-weight="bold" font-style="normal" fill="#5a6475" text-anchor="middle">Layer →</text><rect x="448" y="272" width="478" height="208" rx="16" fill="#1f3864"/><text x="687.0" y="347" font-size="54" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Me</text><text x="687.0" y="405" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Identity · Values</text><text x="687.0" y="457" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Self-sovereignty</text><rect x="955" y="272" width="478" height="208" rx="16" fill="#1f3864"/><text x="1194.0" y="347" font-size="54" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">We</text><text x="1194.0" y="405" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Relationships</text><text x="1194.0" y="457" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Trust · Team</text><rect x="1461" y="272" width="479" height="208" rx="16" fill="#1f3864"/><text x="1700.5" y="347" font-size="54" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">The World</text><text x="1700.5" y="405" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Systems · Visibility</text><text x="1700.5" y="457" font-size="42" font-weight="normal" font-style="normal" fill="#d6e0f2" text-anchor="middle">Presence</text><rect x="60" y="512" width="360" height="300" rx="16" fill="#2e5fa3"/><text x="240" y="624.0" font-size="58" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Taking-Off</text><text x="240" y="690" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">Destabilization &amp;</text><text x="240" y="744" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">positioning</text><rect x="449.5" y="513.5" width="475" height="297" rx="16" fill="#dde7f4" stroke="#2e5fa3" stroke-width="3"/><text x="687.0" y="617" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Releasing the</text><text x="687.0" y="677" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">identity that</text><text x="687.0" y="737" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">no longer fits</text><rect x="956.5" y="513.5" width="475" height="297" rx="16" fill="#dde7f4" stroke="#2e5fa3" stroke-width="3"/><text x="1194.0" y="587" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Earning trust</text><text x="1194.0" y="647" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">while learning</text><text x="1194.0" y="707" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">the relational</text><text x="1194.0" y="767" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">ecosystem</text><rect x="1462.5" y="513.5" width="476" height="297" rx="16" fill="#dde7f4" stroke="#2e5fa3" stroke-width="3"/><text x="1700.5" y="617" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Becoming visible</text><text x="1700.5" y="677" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">to the stakeholders</text><text x="1700.5" y="737" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">who matter</text><rect x="60" y="840" width="360" height="300" rx="16" fill="#1e8449"/><text x="240" y="952.0" font-size="58" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Cruising</text><text x="240" y="1018" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">Competence &amp;</text><text x="240" y="1072" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">the quiet signal</text><rect x="449.5" y="841.5" width="475" height="297" rx="16" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="687.0" y="945" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Realigning the</text><text x="687.0" y="1005" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">role with</text><text x="687.0" y="1065" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">your values</text><rect x="956.5" y="841.5" width="475" height="297" rx="16" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="1194.0" y="945" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Growing beyond</text><text x="1194.0" y="1005" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">the comfort</text><text x="1194.0" y="1065" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">network</text><rect x="1462.5" y="841.5" width="476" height="297" rx="16" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="1700.5" y="945" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Staying strategic</text><text x="1700.5" y="1005" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">when the world</text><text x="1700.5" y="1065" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">is loud</text><rect x="60" y="1168" width="360" height="300" rx="16" fill="#b35a0f"/><text x="240" y="1280.0" font-size="58" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Awakening</text><text x="240" y="1346" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">Meaning &amp;</text><text x="240" y="1400" font-size="42" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">reinvention</text><rect x="449.5" y="1169.5" width="475" height="297" rx="16" fill="#fcebdc" stroke="#b35a0f" stroke-width="3"/><text x="687.0" y="1273" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Becoming who</text><text x="687.0" y="1333" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">you choose</text><text x="687.0" y="1393" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">to be</text><rect x="956.5" y="1169.5" width="475" height="297" rx="16" fill="#fcebdc" stroke="#b35a0f" stroke-width="3"/><text x="1194.0" y="1273" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Leading others</text><text x="1194.0" y="1333" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">toward their own</text><text x="1194.0" y="1393" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">awakening</text><rect x="1462.5" y="1169.5" width="476" height="297" rx="16" fill="#fcebdc" stroke="#b35a0f" stroke-width="3"/><text x="1700.5" y="1273" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">Showing up as</text><text x="1700.5" y="1333" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">the leader you</text><text x="1700.5" y="1393" font-size="44" font-weight="normal" font-style="normal" fill="#1f3864" text-anchor="middle">are becoming</text><line x1="60" y1="1512" x2="1940" y2="1512" stroke="#d6dce5" stroke-width="3"/><text x="1000" y="1584" font-size="42" font-weight="normal" font-style="italic" fill="#5a6475" text-anchor="middle">Each intersection is a chapter in your leadership journey</text><text x="1000" y="1648" font-size="42" font-weight="normal" font-style="normal" fill="#5a6475" text-anchor="middle">Leadership Transition Intelligence™ · by Liru Wang, PhD, ICF MCC</text></svg>
